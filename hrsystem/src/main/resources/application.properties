# ═══════════════════════════════════════════════════
# CedrusTech HR System — Spring Boot Configuration
# ═══════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────
server.port=8081

# ── Python AI Service ────────────────────────────────
ai.service.url=http://localhost:8000
ai.service.timeout-seconds=60
ai.service.max-concurrent-calls=4

# ── Circuit Breaker ──────────────────────────────────
ai.circuit-breaker.failure-threshold=5
ai.circuit-breaker.reset-timeout-ms=10000

# ── Retry with exponential backoff ───────────────────
ai.retry.max-attempts=2
ai.retry.backoff-ms=500

# ── SQL Server ───────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MH_AC;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sola123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# ── File Upload ───────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── CV Storage — ABSOLUTE PATH (fixes FileNotFoundException)
# FIX: ./cvs resolves to Tomcat temp dir, not project dir.
# Always use an absolute path so CV files land in the right place.
cv.storage.path=C:/Users/assil/Downloads/cedrustech_ai/cvs

# ── Thread Pool Executors ─────────────────────────────
executor.core-pool-size=10
executor.max-pool-size=50
executor.queue-capacity=100
executor.keep-alive-seconds=60

# ── Logging ───────────────────────────────────────────
logging.level.com.cedrustech=INFO
logging.level.com.cedrustech.hrsystem.service.AIProxyService=DEBUG